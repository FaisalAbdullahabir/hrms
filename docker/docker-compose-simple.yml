version: '3.8'

services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: frappe/erpnext:latest
    ports:
      - "8000:8000"
    environment:
      - SITE_NAME=localhost
    depends_on:
      - db

volumes:
  db_data: