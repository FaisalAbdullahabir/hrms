version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 123
      MARIADB_DATABASE: erpnext
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine
    restart: always

  erpnext:
    image: frappe/erpnext:latest
    restart: always
    ports:
      - "8080:8000"
    environment:
      - SITE_NAME=erpnext.localhost
      - DB_HOST=mariadb
      - REDIS_CACHE=redis://redis:6379/0
      - REDIS_QUEUE=redis://redis:6379/1
      - REDIS_SOCKETIO=redis://redis:6379/2
    depends_on:
      - mariadb
      - redis
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites

volumes:
  mariadb_data:
  sites_data: